<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyCommune</a>
  </div>
</nav>

<main class="container mt-5 mb-5">
  <div class="text-center mb-4">
    <h1>{{ monTitre }}</h1>
    <p class="text-muted">{{ monIntroduction }}</p>
  </div>

  <div class="card p-4 shadow-sm">
    <p class="text-center fw-semibold">
      {{ maPhraseAccroche }}
    </p>

    <div class="row g-3 align-items-center mt-3">
      <div class="col-md-8">
        <input
          type="text"
          class="form-control"
          placeholder="Exemple : 59"
          [formControl]="champSaisi"
        />
      </div>

      <div class="col-md-4 d-grid">
        <button
          type="button"
          class="btn btn-primary"
          (click)="afficherChampSaisi()"
        >
          Go
        </button>
      </div>
    </div>

    <div class="mt-3" *ngIf="messageErreur !== ''">
      <div class="alert alert-danger mb-0">
        {{ messageErreur }}
      </div>
    </div>

    <div class="mt-4" *ngIf="nbCommunes > 0">
      <div class="alert alert-info">
        {{ nbCommunes }} commune(s) trouvée(s).
      </div>

      <label for="communes" class="form-label">Choisissez une commune</label>

      <select
        id="communes"
        class="form-select"
        [formControl]="communeSelectionnee"
      >
        <option value="">-- Sélectionnez une commune --</option>
        <option *ngFor="let commune of listeCommunes" [value]="commune.nom">
          {{ commune.nom }}
        </option>
      </select>

      <div class="d-grid mt-3">
        <button
          type="button"
          class="btn btn-success"
          (click)="validerCommune()"
        >
          Valider
        </button>
      </div>
    </div>

    <div class="card mt-4 border-0 shadow-sm bg-light" *ngIf="communeAffichee">
      <div class="card-body">
        <h3 class="card-title mb-3">{{ communeAffichee.nom }}</h3>
        <p class="card-text mb-2">
          <strong>Code postal :</strong> {{ communeAffichee.codePostal }}
        </p>
        <p class="card-text mb-0">
          <strong>Population :</strong> {{ communeAffichee.population }}
        </p>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center p-3">
  © MyCommune
</footer>
